services:

  nginx:
    image: nginx
    container_name: infra-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: infra-backend
    expose:
      - "8080"
    restart: unless-stopped
